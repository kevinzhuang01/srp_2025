    developed an R package â\x80\x9Cdsld: Data Science Looks at Discriminationâ\x80\x9D
    with Professor Matloff and several collaborators. I led software design and core
    functionality for discrimination analysis and fair machine learning applications.
    For instance, I implemented code to fit linear/logistic models with interactions
    across sensitive-attribute levels and return factor-wise comparisons of coefficients
    & predictive performance across groups. We also provide graphical tools for segmented
    group comparisons and integrated wrappers for fair-ML algorithms. We include a
    Quarto book to teach key statistical concepts using methods from our package,
    and I am the project maintainer. This experience taught me how to write software,
    documentation, and manage long term maintenance. Links: Software (CRAN): https://cran.r-project.org/web/packages/dsld/index.html.
    Github link: https://github.com/matloff/dsld. Preprint link: https://arxiv.org/abs/2411.04228.
    Pending journal review. I also presented this software at the Joint Statistical
    Meetings 2024 conference. 3. LLM + GNN for security datasets: I worked on a summer
    (2024) project to combine LLM-based relation extraction with GNN link prediction
    to create a knowledge graph using multiple hardware-security datasets (vulnerabilities,
    weaknesses, attack patterns). I worked on data cleaning and briefly contributed
    to the training of the model. I gained hands-on experience with modern deep learning
    frameworks and GPU programming. I am starting research at UC Irvine on â\x80\x9CAI
    for thermal energy storage systemsâ\x80\x9D. We will use RNNs on time-series temperature
    data. The project is in early stages so more details will come later."
  Please describe your research/academic interests.: My academic interests are in
    applied statistics and machine learning. My current research centers on algorithmic
    fairness and understanding the social impact of machine-learning systems. Moving
    forward, I plan to study how the multivariate structure of high-dimensional datasets
    (many categorical features, image data, etc.) drives measured disparities among
    sensitive features. Since variables interact and correlate in practice, these
    dependencies can change both fairness metrics and bias mitigation strategies.
    I want to develop and evaluate fairness methods in deep learning settings for
    complex data modalities such as images, text, and audio. Some potential areas
    include fair representation learning, learning under distribution shifts in training
    vs. deployment data, and fairness benchmarking (what does fairness even mean?).
    I am particularly interested in generative models and their fairness research
    directions. Beyond fairness, I am interested in causal inference and causal ML
    for model interpretability. I am very open to adjacent research directions in
    optimization, probabilistic modeling, information theory etc. to help develop
    mathematical maturity. These areas can also indirectly inform fairness research,
    so I hope to gain a broad perspective of the different avenues and strategies
    in artificial intelligence research.
