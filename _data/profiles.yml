  Please describe your research/academic interests.: "My research and academic interests
    are centered on the application and development of deep learning models for advancing
    discovery in computational materials science, Earth/planetary science, and quantum
    information science. I am particularly fascinated by deep neural network architectures
    â\x80\x93 ranging from convolutional neural networks (CNNs) and graph neural networks
    (GNNs) to physics-informed neural networks (PINNs) â\x80\x93 and their potential
    to address domain-specific scientific challenges. For example, super-resolution
    models such as ESRGAN and SRGAN have powerful applications in enhancing resolution
    and reducing noise in microscopy and spectroscopy datasets, including TEM and
    synchrotron experiments. Integrating these methods into data processing pipelines
    opens exciting possibilities for accelerating analysis and enabling new physical
    insights. From a theoretical standpoint, I am deeply interested in designing architectures
    that integrate physical constraints, symmetry operations, and domain-specific
    priors directly into a modelâ\x80\x99s inductive bias. This includes developing
    PINNs and GNNs that can explicitly represent crystal structures, lattice symmetries,
    and phase transitions, allowing the network to capture essential physics while
    learning from data. I am equally passionate about leveraging high-performance
    computing (HPC) for scaling these models, optimizing training across multi-GPU
    and distributed environments, and solving large-scale inverse problems. My long-term
    goal is to bridge experimental data with physics-grounded AI algorithms, enabling
    deeper understanding and faster discovery in planetary-relevant materials and
    astrophysical systems."
