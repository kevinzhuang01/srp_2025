  Short Biography (Maximum 200 words): "Amandaâ\x80\x99s academic research focuses
    on developing AI-driven solutions for healthcare, with an emphasis on cardiothoracic
    disease detection and treatment. Her graduate work centers on chronic obstructive
    pulmonary disease (COPD), the third leading cause of death worldwide. Traditional
    AI models for COPD staging require both inspiratory and expiratory CT scans, though
    the latter is not clinically standard and increases radiation exposure. Amanda
    demonstrated that a single CT acquisition is sufficient for accurate staging,
    enabling safer and more accessible diagnosis without sacrificing performance.
    Amanda is also developing self-supervised AI methods that leverage chest radiographs
    to learn low-dimensional, clinically meaningful feature representations. These
    techniques accelerate tasks such as pathology classification, biomarker discovery,
    and abnormality localization while reducing computational burden. Amanda has also
    gained experience in defense as a Machine Learning R&D Intern at Design West Technologies,
    Inc., where she designs deep learning algorithms in Python for Department of Defense
    research applications. She contributes to data ingestion, visualization, and autonomous
    system simulation using Microsoft AirSim, reinforcement learning, and other AI/ML
    approaches. Additionally, she supports proposal development and strategic planning,
    integrating technical expertise with confidentiality and compliance requirements.
    Her long-term goal is to solve problems in high-impact environments and apply
    cutting-edge research to benefit society."
