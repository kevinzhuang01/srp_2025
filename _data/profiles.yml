  Please describe your research/academic interests.: My research lies at the intersection
    of applied mathematics, high-performance computing (HPC), and data-driven scientific
    computing. As a Ph.D. candidate in Applied Mathematics at the University of Illinois
    Chicago, my focus is on developing and analyzing computational methods that address
    large-scale scientific problems involving partial differential equations (PDEs),
    optimization, and numerical analysis. A major part of my current work involves
    scalable algorithms for distributed computation. For example, I have designed
    and benchmarked MPI-based root-finding algorithms, explored shared-memory parallelization
    of matrix multiplication with OpenMP, and implemented GPU-accelerated trapezoidal
    integration schemes in CUDA. These projects deepened my understanding of numerical
    stability and algorithmic complexity and also gave me practical experience in
    optimizing performance across diverse architectures. Alongside HPC, I am increasingly
    engaged with machine learning for scientific applications, including integrating
    neural networks into PDE solvers and using data-driven approaches to enhance predictive
    accuracy in physical models. I am also developing familiarity with quantum computing
    concepts, particularly in their potential applications to optimization and simulation.
    My technical toolkit includes Python, Julia, and MATLAB, supported by strong experience
    with Linux/Unix systems, Git, MPI, and GPU environments. I am motivated by the
    challenge of building algorithms and models that are not only mathematically rigorous
    but also computationally scalable and applicable to real-world systems. I see
    my long-term research trajectory as contributing to the development of robust,
    efficient, and secure computational methods that advance both scientific discovery
    and technological innovation.
