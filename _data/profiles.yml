  Short Biography (Maximum 200 words): "Miriam is dedicated to advancing equitable
    healthcare through AI. As a Computer Science graduate student at Emory University,
    she applies deep learning to critical clinical challenges with a focus on reducing
    healthcare disparities. Her primary research integrates thermography with deep
    learning to enable early detection of pressure injuries, particularly for underrepresented
    skin tones where disparities are most pronounced yet understudied. Preliminary
    findings from this work have been published in PLOS ONE. Additionally, her research
    on longitudinal electronic health records identified how improper data partitioning
    can introduce leakage that artificially inflates model performance, findings accepted
    at AMIA with broader implications for any EHR-based prediction task. Beyond research,
    Miriam actively contributes to the ML4H community as both a presenter and reviewer,
    and also reviews for Springer Cureus. She participates in initiatives like Emoryâ\x80\x99s
    Health AI Bias Datathons and regularly attends symposiums and webinars to stay
    current in the field. She also mentors Emory undergraduates pursuing STEM careers.
    Through collaborative, responsible innovation, Miriam aspires to build AI tools
    that improve patient outcomes and reduce healthcare disparities."
