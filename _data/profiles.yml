  Please describe your research/academic interests.: My research interests lie at
    the intersection of causal modeling and generative modeling, with a particular
    focus on applications in High-Performance Computing (HPC). My first paper (published
    in IEEE Compsac 24) aimed at creating realistic synthetic traces that preserve
    causal dependencies and performance dynamics as many HPC workloads are under-represented
    or noisy, making it difficult to train robust predictive or causal models. I did
    a comparison between the quality of data generated by a GAN based model and an
    LLM-based model along with introducing a metric to compare the quality of synthetic
    data. My other paper published in ICASSP 25 was based on improving the results
    of the synthetic data via providing additional semantic information to the LLM
    during the training process. Currently, I am working on a decision-support framework
    that combines causal inference and generative modeling to provide actionable insights
    for HPC system management.
