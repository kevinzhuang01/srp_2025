  ? What courses or academic preparation have you completed to prepare for a summer
    internship experience (we recommend at least two science or computer science classes)?
  : Given my tenure in academia, I have demonstrated proficiency in a myriad of courses
    related to mathematics and computer science. Notably, I have completed coursework
    exploring neural network theory and various neural network architectures, stochastic
    processes, linear/non-linear optimization, and Python coding. In addition to my
    academic courses, I have worked in multiple research environments where I honed
    my skills as an independent researcher. Initially, I was a researcher at a neuroscience
    lab at Duke University overseen by Dr. Rajendra Morey. I explored potential applications
    of deep learning to understand the dynamic, short-term interactions between brain
    regions for individuals with PTSD. Currently, I work with Dr. Edgar Lobaton at
    NC State researching 2D to 3D reconstruction, as described in the next section.
  Please describe your research/academic interests.: My current research involves
    2D to 3D reconstruction using NeRF models. My team and I are attempting to accurately
    reconstruct the interior of seashell-like creatures called foraminifera (foram).
    Understanding the external and internal attributes of the foram allows researchers
    to gain insight about the ocean's environment at the time they were alive. Some
    foram fossils are millions of years old, so the information that can be gained
    from analyzing their structure is invaluable. However, uncovering the internal
    structure of the foram using CT scanning is expensive and time consuming. Our
    team plans to implement a pre-trained NeRF model to generate a 3D volumetric mesh
    of the foram using 2D images of the exterior of a given foram. Subsequently, our
    team will need to investigate how many 2D images we need to capture, how the camera
    should be positioned for these images, and any additional components of machine
    learning that should be utilized so that the 3D reconstruction is as similar as
    possible to the foram's true structures (internal and external). Additionally,
    the team hopes to utilize a combination of stochastic modeling and physics informed
    neural networks (PINNs) to automate the wet-imaging of the foram. The imaging
    process requires precise control of the camera and a microfluidic system to gently
    rotate the foram and capture 2D images. In general, microfluidic systems exhibit
    stochastic behaviors due to the random fluctuations in the flow rate. Thus, this
    aspect of the research is a perfect opportunity to combine both stochastic process
    modeling with a deterministic component like a PINN.
