  Please describe your research/academic interests.: My research interests focus on
    the application of artificial intelligence, machine learning, and data science
    to advance sustainable and equitable solutions in engineering, engineering education,
    and society. Artificial intelligence holds the potential to accelerate discovery
    and innovation while changing the way of work. However, researchers and educators
    lack access to the AI resources necessary to fully conduct their research activities
    and to train the next generation. I am particularly motivated by how artificial
    intelligence (AI) and machine learning (ML) methods can be scaled to address complex,
    data-intensive challenges. My research explores how Generative Artificial Intelligence
    (GenAI) can be responsibly integrated into engineering education to enhance learning
    and decision-making. Through a mixed-methods study with first-year engineering
    students, I examine how collaboration with AI affects problem-solving, cognitive
    load, and reasoning during complex design tasks. Using quantitative analyses and
    qualitative insights from think-aloud protocols and interaction logs, I identify
    patterns of productive and unproductive AI use. The goal of my dissertation is
    to develop a validated model of student-AI collaboration that guides educators
    in balancing technological support with authentic learning, ensuring that AI enhances,
    rather than replaces, the critical thinking and creativity essential to engineering
    practice. I have developed experience in applying AI to human-centered problems,
    including analyzing large transcript datasets with natural language processing,
    using machine learning models to classify interaction patterns, and applying multivariate
    statistical methods to evaluate decision-making and performance. I have also pursued
    professional certifications in AI and data science, strengthening my expertise
    in supervised and unsupervised learning, model evaluation, and responsible AI
    practices. My long-term goal is to gain experience that expands my expertise to
    research that contributes to sustainability and resilience. This includes applying
    AI and advanced analytics to sustainable manufacturing, energy efficiency, equitable
    technology adoption, and educational systems that prepare future engineers for
    global challenges.
