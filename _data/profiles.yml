    underway. In addition, I am working on two ongoing projects for which manuscripts
    are in preparation: Vision-Based Passenger Counting and Demographics Analysis:
    This project involves a multi-camera CCTV pipeline that detects, tracks, and re-identifies
    riders to quantify boarding and alighting events while estimating age and gender
    profiles. Electricity Demand Forecasting and Cooling Load Impact in Nairobi: This
    city-scale study combines satellite-derived building archetypes with dynamic thermal
    simulations to model residential cooling demand and assess its effects on transformer
    loading.'
  Please describe your research/academic interests.: 'My research and academic interests
    are at the intersection of sensing technologies, data-driven modeling, and machine
    learning, with a particular focus on urban sustainability and mobility: Computer
    Vision for Public Transportation I develop end-to-end pipelines and models to
    detect, track, and re-identify passengers using on-board and curbside cameras.
    My work focuses on using appearance, temporal logic, and geomatics fusion for
    accurate boarding and alighting counts, considering bus occupancy and demographic
    profiles. Additionally, I create models that analyze driver behavior through camera
    footage and geomatics data to understand how driving patterns relate to accidents
    or incidents. Energy Systems & Demand Forecasting Modeling residential cooling
    loads under changing climate conditions by combining satellite-derived building
    archetypes with dynamic thermal simulations (EnergyPlus, JEPlus). I study how
    increased air-conditioning demand stresses distribution transformers and integrate
    occupancy and market-adoption data to predict future grid impacts. Environmental
    Sensing & Air Quality Designing low-cost, dual-mode sensor networks (solar-powered
    at stops, vehicle-powered on buses) to monitor PM?.? exposure in real time. Focused
    on sensor calibration, over-the-air updates, and turning pollution data into actionable
    insights for transit agencies. Creating end-to-end IoT solutions for off-grid
    deployments, ensuring autonomous operation, cloud sync, and efficient power management
    in resource-limited settings.'
